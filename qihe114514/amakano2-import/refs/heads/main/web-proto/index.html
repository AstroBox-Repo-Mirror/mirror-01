<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161316">
<title>甜蜜女友2 · 导入器</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/fonts/Regular/MiSans-Regular.min.css">
<link rel="stylesheet" href="assets/fonts/Medium/MiSans-Medium.min.css">
<link rel="stylesheet" href="assets/fonts/Semibold/MiSans-Semibold.min.css">
<style>
:root{
  --bg:#161316; --surface:#211C20; --soft:#2C2529; --strong:#3A3136;
  --line:rgba(255,255,255,.07); --line-soft:rgba(255,255,255,.045);
  --text:#F5F0F2; --sub:#B8ACB2; --dim:#9A8D94;
  --accent:#E59BB4; --accent-deep:#BE4E77;
  --ok:#8FBC9B; --warn:#D8AE6A; --bad:#D98A7C;
  --track:rgba(255,255,255,.08);
  --pad:16px; --nav-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:400 14px/1.6 MiSans,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;border:0;outline:none}
::-webkit-scrollbar{display:none}
.num{font-variant-numeric:tabular-nums}
.ic{display:inline-flex;flex-shrink:0;vertical-align:middle}
.ic svg{width:100%;height:100%;stroke-width:1.6}

/* ---------- 外壳 ---------- */
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:10px;padding:14px var(--pad) 12px}
#topbar .mark{width:30px;height:30px;border-radius:8px;flex-shrink:0}
#topbar .name{font-size:16px;font-weight:600;letter-spacing:.2px}
#topbar .dev{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
#topbar .dev .dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}
#topbar .dev.off .dot{background:var(--bad)}

/* 传输状态区：外壳，切页不重建、不动画 */
#transfer{margin:0 var(--pad) 4px;min-height:30px}
#transfer .idle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);padding:6px 2px 10px}
#transfer .idle .ic{width:14px;height:14px}
#transfer .box{background:var(--surface);border-radius:14px;padding:13px 15px}
#transfer .t-row{display:flex;align-items:center;gap:8px}
#transfer .t-name{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#transfer .t-pct{font-size:16px;font-weight:500;color:var(--accent)}
#transfer.held .t-pct{color:var(--warn)}
#transfer .bar{height:4px;background:var(--track);border-radius:2px;margin:11px 0 8px;overflow:hidden}
#transfer .bar>i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s linear}
#transfer.held .bar>i{background:var(--warn)}
#transfer .t-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
#transfer .t-ops{display:flex;gap:8px;margin-top:11px}

#view{flex:1;padding:6px var(--pad) calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}

/* 底栏：实心，无模糊，选中靠颜色 */
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#1A1619;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
#navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 5px;color:var(--dim)}
#navbar button.on{color:var(--accent)}
#navbar button .ic{width:21px;height:21px}
#navbar button .lb{font-size:10.5px;letter-spacing:.5px}
#navbar .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
#navbar .nb{position:absolute;top:-3px;right:-10px;min-width:13px;height:13px;padding:0 3px;background:var(--accent-deep);color:#fff;font-size:9px;border-radius:7px;display:grid;place-items:center;font-weight:600}

/* ---------- 动效 ---------- */
/* 缓出曲线：起步快、收尾长，接近 iOS 的自然感，不回弹 */
:root{--ease:cubic-bezier(.22,1,.36,1);--press:cubic-bezier(.3,.7,.4,1)}

/* 内容区入场：整页淡入 + 各块错落上浮（只作用内容区，传输卡/外壳不参与） */
.page{animation:pageIn .3s var(--ease) both}
.page>*{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 按下即时反馈：pointer-down 就缩放，不等 click */
.btn{transition:transform .12s var(--press),opacity .12s,background .18s}
.btn:active{transform:scale(.95);opacity:.85}
.ibtn{transition:transform .12s var(--press),background .15s}
.ibtn:active{transform:scale(.85)}
.chip{transition:background .2s,color .2s,transform .12s var(--press)}
.chip:active{transform:scale(.93)}
.seg button{transition:background .2s,color .2s}
#navbar button{transition:color .2s}
#navbar button .ic{transition:transform .25s var(--ease)}
#navbar button.on .ic{transform:translateY(-1px)}
#navbar button:active .ic{transform:scale(.85)}

/* 统计条形图：入场时从 0 长到真实值 */
.day .b>i{transform-origin:left;animation:growX .55s var(--ease) both;animation-delay:calc(.15s + var(--i,0)*45ms)}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* 大数字入场：轻微上浮即可，不滚动计数（读数类不需要表演） */
.stat-lead .v{animation:rise .45s var(--ease) both}

@media (prefers-reduced-motion:reduce){
  .page,.page>*,.day .b>i,.stat-lead .v{animation:none!important}
  .btn:active,.ibtn:active,.chip:active{transform:none}
}

/* ---------- 通用 ---------- */
.sec{font-size:13px;color:var(--dim);margin:24px 2px 9px;display:flex;align-items:center;justify-content:space-between}
.sec:first-child{margin-top:4px}
.sec .lk{font-size:12.5px;color:var(--sub)}
.panel{background:var(--surface);border-radius:14px;padding:2px 15px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.kv:last-child{border:0}
.kv .k{color:var(--sub)}
.kv .v{font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:9px;font-size:13px;font-weight:500;background:var(--accent-deep);color:#fff;transition:opacity .12s}
.btn:active{opacity:.7}
.btn.ghost{background:var(--soft);color:var(--sub)}
.btn.text{background:none;color:var(--sub);padding:0 6px}
.btn.sm{height:31px;padding:0 13px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%;height:45px;border-radius:12px;font-size:14px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn .ic{width:15px;height:15px}

.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;line-height:1.5;white-space:nowrap;background:var(--soft);color:var(--sub)}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.acc{color:var(--accent)} .tag.bad{color:var(--bad)}
.foot-note{font-size:12px;color:var(--dim);line-height:1.85;margin-top:18px;text-align:center;letter-spacing:.01em}
.empty{padding:30px 0;text-align:center;color:var(--dim);font-size:13px}

/* ---------- 推送 ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad)}
.chip{flex-shrink:0;font-size:13px;padding:7px 15px;border-radius:9px;color:var(--dim);background:var(--surface)}
.chip.on{color:var(--accent);background:var(--soft)}
.chap{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.chap:last-child{border-bottom:0}
.chap .l1{display:flex;align-items:center;gap:8px}
.chap .t{font-size:15px;font-weight:500;flex:1;min-width:0}
.chap .l2{display:flex;align-items:center;gap:12px;margin-top:6px}
.chap .meta{font-size:12px;color:var(--dim);flex:1;letter-spacing:.01em}
.chap .ops{display:flex;gap:8px;flex-shrink:0}
.chap .prog{height:3px;background:var(--track);border-radius:2px;margin-top:10px;overflow:hidden}
.chap .prog>i{display:block;height:100%;background:var(--accent)}

/* ---------- 存档 ---------- */
.saves-ops{display:flex;gap:10px;margin-top:4px}
.saves-ops .btn{flex:1;height:41px;border-radius:11px;font-size:13px}
.save-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.save-row:last-child{border:0}
.save-row .info{flex:1;min-width:0}
.save-row .t{font-size:15px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.save-row .m{font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:.01em}
.save-row .ops{display:flex;gap:2px}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;color:var(--sub)}
.ibtn:active{background:var(--soft)}
.ibtn .ic{width:16px;height:16px}
.ibtn.warn{color:var(--bad)}

/* ---------- 统计 ---------- */
.stat-lead{padding:14px 2px 4px}
.stat-lead .v{font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.stat-lead .v small{font-size:14px;font-weight:400;color:var(--sub);margin-left:3px;letter-spacing:0}
.stat-lead .k{font-size:12px;color:var(--dim);margin-top:5px;letter-spacing:.01em}
.day{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.day:last-child{border:0}
.day .d{font-size:12.5px;color:var(--sub);width:48px;flex-shrink:0}
.day .b{flex:1;height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.day .b>i{display:block;height:100%;background:var(--accent);border-radius:2px}
.day .v{font-size:12px;color:var(--dim);width:48px;text-align:right;flex-shrink:0}

/* ---------- 账号 ---------- */
.acct-head{display:flex;align-items:center;gap:14px;padding:18px 15px;background:var(--surface);border-radius:14px}
.acct-head .avatar{width:52px;height:52px;border-radius:50%;background:var(--soft);flex-shrink:0;display:grid;place-items:center;color:var(--dim);overflow:hidden;border:2px solid rgba(229,155,180,.35)}
.acct-head .avatar .ic{width:24px;height:24px}
.acct-head .avatar img{width:100%;height:100%;object-fit:cover}
.acct-head .who{flex:1;min-width:0}
.acct-head .nm{font-size:16px;font-weight:600}
.acct-head .sub{font-size:12px;color:var(--dim);margin-top:3px}
.bind-code{display:flex;gap:8px;margin-top:12px}
.code-display{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--bg);border:1px dashed var(--line);border-radius:11px;padding:14px 16px}
.code-text{flex:1;font-size:24px;font-weight:600;letter-spacing:3px;color:var(--accent)}
.copy-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:9px;background:var(--soft);color:var(--sub);transition:transform .12s var(--press),background .15s}
.copy-btn:active{transform:scale(.9);background:var(--strong)}
.copy-btn .ic{width:17px;height:17px}
.copy-btn span{font-size:11px}
.bind-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.bind-expire{font-size:12px;color:var(--warn)}
.bind-code input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:16px;letter-spacing:4px;text-align:center;font-weight:500}
.bind-code input::placeholder{color:var(--dim);letter-spacing:2px;font-size:13px;font-weight:400}
.bind-code .btn{height:auto;padding:0 18px}

/* ---------- 设置 ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.set-row:last-child{border:0}
.set-row .l{flex:1;min-width:0}
.set-row .t{font-size:14px}
.set-row .d{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.65;letter-spacing:.01em}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px;flex-shrink:0}
.seg button{font-size:12.5px;padding:6px 15px;border-radius:7px;color:var(--dim)}
.seg button.on{background:var(--accent-deep);color:#fff}
.sw{width:42px;height:25px;border-radius:13px;background:var(--strong);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent-deep)}
.sw.on::after{transform:translateX(17px)}
.log{font-size:11.5px;color:var(--dim);padding:7px 0;border-bottom:1px solid var(--line-soft);line-height:1.65;word-break:break-all;letter-spacing:.01em}
.log:last-child{border:0}
.log .w{color:var(--warn)} .log .e{color:var(--bad)}
.about{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;color:var(--sub);border-bottom:1px solid var(--line-soft)}
.about:last-child{border:0}
.about span:last-child{color:var(--dim)}

/* ---------- 弹层 ---------- */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#mask.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:520px;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));z-index:41;transition:transform .25s cubic-bezier(.3,.7,.3,1)}
#sheet.show{transform:translate(-50%,0)}
#sheet h3{font-size:16px;font-weight:600;margin-bottom:10px}
#sheet p{font-size:13px;color:var(--sub);line-height:1.85;margin-bottom:18px}
#sheet .ops{display:flex;gap:10px}
#sheet .ops .btn{flex:1;height:43px;border-radius:11px}
#sheet textarea{width:100%;height:130px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:11.5px;padding:11px;resize:none;line-height:1.6;font-family:ui-monospace,monospace}
@media (prefers-reduced-motion:reduce){#sheet{transition:opacity .2s;transform:translate(-50%,0)!important;opacity:0}#sheet.show{opacity:1}}

#toast{position:fixed;top:64px;left:50%;transform:translate(-50%,-10px);z-index:50;background:var(--strong);color:var(--text);font-size:13px;padding:11px 20px;border-radius:11px;opacity:0;pointer-events:none;transition:all .22s;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <img class="mark" src="assets/icon.png" alt="">
    <h1 class="name">甜蜜女友2</h1>
    <span class="dev" id="dev"><i class="dot"></i><span id="dev-name">小米手环 10 Pro</span></span>
  </div>
  <div id="transfer"></div>
  <div id="view"></div>
  <nav id="navbar"></nav>
</div>
<div id="mask" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
const ICON_PATHS={

};
function icon(n,c){return `<span class="ic ${c||''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[n]||''}</svg></span>`}

/* ============ 数据（模拟；接入时 store←轮询 /api/state，act←POST /api/action） ============ */
const PACKS=[
  {file:'p00',title:'公共资源',bytes:5369366,minutes:0,kind:'resource'},
  {file:'p01',title:'共通线 · 第1-5章',bytes:404880,minutes:338,line:'共通线'},
  {file:'p02',title:'千岁线 · 第6-8章',bytes:2142298,minutes:709,line:'千岁线'},

const packOf=f=>PACKS.find(p=>p.file===f);
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('复制失败，请手动长按复制')}
  document.body.removeChild(ta);
}
function addLog(lv,m){const d=new Date(),ts=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');store.logs.unshift([lv,ts,m]);if(store.logs.length>60)store.logs.pop()}

setInterval(()=>{
  const t=store.transfer;if(!t||t.state!=='run')return;
  t.pct=Math.min(100,+(t.pct+0.35).toFixed(2));t.speed=+(38+Math.random()*8).toFixed(1);
  if(t.pct>=100){
    store.installed[t.pack]=true;delete store.partial[t.pack];
    addLog('i',t.pack+'.pack 同步完成');toast(packOf(t.pack).title+' 同步完成');
    if(t.queue.length){const n=t.queue.shift();store.transfer={pack:n,pct:store.partial[n]||0,speed:t.speed,eta:'计算中',state:'run',queue:t.queue}}
    else store.transfer=null;
    render();return;

},400);

/* ============ 动作 ============ */
function act(name,arg){
  const a=store.account;
  switch(name){
    case 'tab': store.tab=arg;closeSheet();render();break;
    case 'filter': store.filter=arg;render();break;
    case 'sync':{
      if(store.transfer){store.transfer.queue.push(arg);toast('已加入队列');render();return}
      if(!store.installed.p00&&arg!=='p00'){toast('请先同步公共资源');return}
      store.transfer={pack:arg,pct:store.partial[arg]||0,speed:0,eta:'计算中',state:'run',queue:[]};
      addLog('i','开始同步 '+arg+'.pack');render();break;
    }
    case 'sync-all':{
      const rest=PACKS.filter(p=>!store.installed[p.file]&&p.file!=='p00');
      if(!rest.length){toast('全部章节已安装');return}
      if(store.transfer){toast('已有传输任务');return}
      const[f,...q]=rest.map(p=>p.file);
      store.transfer={pack:f,pct:store.partial[f]||0,speed:0,eta:'计算中',state:'run',queue:q};
      toast('已排队 '+rest.length+' 章');render();break;
    }
    case 'pause': if(store.transfer){store.transfer.state='held';store.partial[store.transfer.pack]=Math.floor(store.transfer.pct);render()}break;
    case 'resume': if(store.transfer){store.transfer.state='run';delete store.partial[store.transfer.pack];render()}break;
    case 'cancel': store.transfer=null;toast('传输已取消');render();break;
    case 'uninstall':{
      const p=packOf(arg);
      openSheet(`<h3>删除「${esc(p.title)}」？</h3><p>从手环删除该章节（${fmtSize(p.bytes)}），删除后需重新同步才能阅读。不影响存档。</p>
        <div class="ops"><button class="btn ghost" onclick="closeSheet()">取消</button>
        <button class="btn" style="background:var(--bad)" onclick="act('uninstall-yes','${arg}')">删除</button></div>`);break;
    }
    case 'uninstall-yes': delete store.installed[arg];closeSheet();toast('已删除');addLog('i','手环删除 '+arg);render();break;
    case 'export-saves':
      openSheet(`<h3>导出存档</h3><p>已复制 ${store.saves.length} 个存档。粘贴到备忘录或任意文本文件保存，建议文件名 amakano2-saves-2026-10-31.json。</p>
        <textarea readonly>${esc(JSON.stringify({format:'amakano2-saves',save_version:1,saves:store.saves},null,2))}</textarea>
        <div class="ops" style="margin-top:14px"><button class="btn block" onclick="closeSheet();toast('已复制到剪贴板')">复制</button></div>`);break;
    case 'import-saves':
      openSheet(`<h3>从剪贴板导入</h3><p>粘贴之前导出的存档 JSON（整段），按 savedAt 并入手环，重复自动跳过。</p>
        <textarea placeholder='{"format":"amakano2-saves", …}'></textarea>
        <div class="ops" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">取消</button>
        <button class="btn" onclick="closeSheet();toast('导入 2 个存档，跳过 1 个重复')">导入</button></div>`);break;
    case 'load-save': toast('已设为继续阅读：'+arg);break;
    case 'del-save':
      openSheet(`<h3>删除存档？</h3><p>删除手环上「${esc(arg)}」这条存档，不可恢复。</p>
        <div class="ops"><button class="btn ghost" onclick="closeSheet()">取消</button>
        <button class="btn" style="background:var(--bad)" onclick="store.saves=store.saves.filter(s=>s.title!=='${esc(arg)}');closeSheet();render();toast('存档已删除')">删除</button></div>`);break;
    case 'mode': store.settings.mode=arg;toast(arg==='turbo'?'激进档：窗口 12 片起':'正常档：稳定优先');render();break;
    case 'toggle': store.settings[arg]=!store.settings[arg];render();break;
    case 'clear-logs': store.logs=[];render();break;
    case 'device':
      openSheet(`<h3>设备与连接</h3><p>小米手环 10 Pro · 已连接<br>syncProtocol v3 · 统计 v1<br>《甜蜜女友2》v3.0.7 已安装</p>
        <div class="ops"><button class="btn ghost block" onclick="closeSheet();toast('正在重新读取手环状态')">刷新状态</button></div>`);break;
    /* ---- 账号 ---- */
    case 'login': a.signedIn=true;a.phase='unbound';render();toast('已登录 AstroBox');break;
    case 'logout':
      openSheet(`<h3>退出登录？</h3><p>退出后本机不再自动同步云存档，云端已保存的存档保留。</p>
        <div class="ops"><button class="btn ghost" onclick="closeSheet()">取消</button>
        <button class="btn" style="background:var(--bad)" onclick="store.account.signedIn=false;store.account.phase='signed-out';closeSheet();render()">退出</button></div>`);break;
    case 'gen-code':{
      // 生成一次性绑定码（真实：POST /account/binding-code），10 分钟有效
      a.bindCode=String(Math.floor(100000+Math.random()*900000));
      a.bindExpire=Date.now()+10*60*1000;
      render(false);break;
    }
    case 'copy-bind':{
      const cmd='绑定'+a.bindCode;   // 完整命令，无空格，粘贴到 QQ 群即可发送
      const done=()=>{toast('已复制「'+cmd+'」，去 QQ 群粘贴发送')};
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(cmd).then(done).catch(()=>fallbackCopy(cmd,done));
      }else fallbackCopy(cmd,done);
      break;
    }
    case 'check-bind':
      // 真实：轮询 /account/session 看 QQ 是否已绑定；这里模拟发完命令后绑定成功
      a.phase='syncing';render();
      setTimeout(()=>{a.phase='synced';a.boundDevice='小米手环 10 Pro';a.lastSync='刚刚';a.bindCode=null;a.bindExpire=null;render(false);toast('绑定成功，已开始同步')},900);
      break;
    case 'unbind':
      openSheet(`<h3>解绑手环？</h3><p>解绑后这台手环的存档不再上传到云端，云端已有存档保留。</p>
        <div class="ops"><button class="btn ghost" onclick="closeSheet()">取消</button>
        <button class="btn" style="background:var(--bad)" onclick="store.account.phase='unbound';store.account.boundDevice=null;closeSheet();render();toast('已解绑')">解绑</button></div>`);break;
    case 'sync-now':
      a.phase='syncing';render();
      setTimeout(()=>{a.phase='synced';a.lastSync='刚刚';render();toast('云存档已同步')},1100);break;
  }
}

    <div class="set-row"><div class="l"><div class="t">分片档位</div><div class="d">正常档窗口 6–10 片；激进档 12 片起，近距离更快</div></div>

    <div class="set-row"><div class="l"><div class="t">断线自动续传</div><div class="d">重连后自动接上，同一章最多 3 次</div></div>
      <div class="sw ${st.autoResume?'on':''}" onclick="act('toggle','autoResume')"></div></div>
    <div class="set-row"><div class="l"><div class="t">保留未完成缓存</div><div class="d">插件重启后仍可手动继续断点</div></div>
      <div class="sw ${st.keepCache?'on':''}" onclick="act('toggle','keepCache')"></div></div>
  </div>
  <div class="sec">设备</div>
  <div class="panel">
    <div class="set-row"><div class="l"><div class="t">小米手环 10 Pro</div><div class="d">syncProtocol v3 · 统计 v1 · 应用 v3.0.7</div></div>
      <button class="btn sm ghost" onclick="act('device')">详情</button></div>
  </div>
  <div class="sec">运行日志<button class="lk" onclick="act('clear-logs')">清空</button></div>
  <div class="panel" style="max-height:210px;overflow-y:auto">
    ${store.logs.length?store.logs.map(([lv,ts,m])=>`<div class="log"><span class="${lv==='w'?'w':lv==='e'?'e':''}">[${ts}]</span> ${esc(m)}</div>`).join(''):'<div class="empty" style="padding:14px">暂无日志</div>'}
  </div>
  <div class="sec">关于</div>
  <div class="panel">
    <div class="about"><span>插件版本</span><span>4.0.0-html（原型）</span></div>
    <div class="about"><span>渲染方式</span><span>HTML · http-server + browser</span></div>
    <div class="about"><span>界面字体</span><span>MiSans</span></div>
    <div class="about"><span>作者</span><span>其核</span></div>
  </div>`;
}

function render(animate){
  renderNav();renderTransfer();
  // 切页才播入场动画；同页的状态更新（筛选/开关/暂停等）直接替换，不重放动画
  const cls=animate===false?'page no-anim':'page';
  $('#view').innerHTML=`<div class="${cls}">${{push:pushHTML,saves:savesHTML,stats:statsHTML,account:accountHTML,settings:settingsHTML}[store.tab]()}</div>`;
  $('#view').querySelectorAll('.page>*').forEach((el,i)=>el.style.setProperty('--i',i));
  $('#view').querySelectorAll('.day').forEach((el,i)=>el.style.setProperty('--i',i));
  updateBindExpire();
}

/* 绑定码倒计时：剩余 mm:ss，过期后提示重新生成 */
function updateBindExpire(){
  const el=$('#bind-expire');if(!el)return;
  const a=store.account;
  if(!a.bindExpire){el.textContent='10 分钟内有效';return}
  const left=Math.max(0,a.bindExpire-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  if(left<=0){el.textContent='已过期，请重新生成';el.style.color='var(--bad)'}
  else{el.textContent=`${m}:${String(s).padStart(2,'0')} 后过期`;el.style.color='var(--warn)'}
}
setInterval(updateBindExpire,1000);
render();
</script>
</body>
</html>
