<script>
/* 预览垫片：把后端的 `/api/state` 轮询换成这里推来的假快照。
   其余渲染走的仍是生产用的 app.js，一行没改。
   `app.js` 里 `let S` / `let tab` 都在全局词法环境里，同一文档的后续脚本能直接读写。 */
let mockState = {};
window.fetch = (url) => {
  const isState = String(url).includes('/api/state');
  const body = isState ? JSON.stringify(mockState) : '{"ok":true}';
  return Promise.resolve({ ok:true, status:200, json:()=>Promise.resolve(JSON.parse(body)), text:()=>Promise.resolve(body) });
};
window.addEventListener('message', (e) => {
  if (!e.data?.state) return;
  mockState = e.data.state;
  // 直接写进 app.js 的状态并重画，不必等 700ms 那一轮轮询。
  S = mockState;
  tab = e.data.tab || 'account';
  lastSig = '';
  render(true);
});
</script>
<script>
/* 无头截图用：`frame.html?scenario=bound&tab=account` 直接把假快照塞进去。

                  recent:[{date:'10-31',label:'48 分钟',seconds:2880},{date:'10-30',label:'1 小时 20 分',seconds:4800},{date:'10-29',label:'22 分钟',seconds:1320}]} },

const params = new URLSearchParams(location.search);
const scenario = params.get('scenario');
// 轮询会把 mockState 盖回 `{}`，所以拦截点放在 fetch 的返回值上：
// 让它永远吐这份假快照，页面就不会在 700ms 后掉回空壳。
mockState = SCENARIOS[scenario] || {};
</script>
<script src="../web/app.js"></script>
<script>
if (scenario && SCENARIOS[scenario]) {
  tab = params.get('tab') || 'account';
  lastSig = '';
  fetchState();
}
/* 溢出诊断：把「谁比视口宽」打出来（无头截图取 console 用）。 */
window.addEventListener('load', () => {
  const wide = [...document.querySelectorAll('body *')]
    .filter(el => el.scrollWidth > document.documentElement.clientWidth + 1)
    .slice(0, 8)
    .map(el => `${el.tagName.toLowerCase()}.${el.className||''} sw=${el.scrollWidth} cw=${el.clientWidth}`);
  console.log('viewport=' + document.documentElement.clientWidth
    + ' docScroll=' + document.documentElement.scrollWidth
    + ' bodyScroll=' + document.body.scrollWidth);
  console.log('overflowing:', wide.join(' | ') || '(none)');
});
</script>
