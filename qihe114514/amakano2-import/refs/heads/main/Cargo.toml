[package]
name = "amakano2-import"
version = "2.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
amakano2-ui = { path = "ui-core" }
astrobox-ng-wit = "0.2.1"
base64 = "0.22"
# 存档信封（`src/saves.rs`）要 derive Serialize/Deserialize：字段名必须逐字固定，
# 手写 JSON 拼装迟早会跟 `parse_save_file` 漂开。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# 只在 wasm 宿主侧用（`host/logger.rs`）。**必须按 target 收窄**：宿主机上跑
# `cargo test -p amakano2-import` 时，它是唯一把 `windows-sys` 拉进来的依赖，
# 而 GNU 工具链的 dlltool 在本机建不出它的导入库，宿主测试整个编不过。
# 插件本体是 wasm 组件，宿主 target 上那段代码本来就 `#[cfg]` 掉了，收窄没有行为影响。
[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-subscriber = "0.3"

# ui-core 是不含宿主的纯界面树，单独成成员后可以在宿主机上跑 `cargo test -p amakano2-ui`
# （插件本体是 wasm 组件，宿主机上编不过）。
[workspace]
members = ["ui-core"]
